name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a PR makes the run already going for it moot, so that one is
# cancelled. A run on main is never cancelled: every commit that lands gets a verdict,
# and a deploy is never cut off halfway. Runs on main queue behind one another
# instead, so two quick merges deploy in the order they landed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Without a client ID the site still builds, and then cannot sign in — the
      # footer says Drive is not configured. Better that a deploy fails here.
      - name: Check the client ID is set
        if: github.ref == 'refs/heads/main'
        run: test -n "$VITE_GOOGLE_CLIENT_ID" || { echo "::error::Repository variable VITE_GOOGLE_CLIENT_ID is not set"; exit 1; }
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      # Not a secret — the client ID ships in the bundle — but it stays out of the
      # source, as `app/.env.example` explains.
      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      # The deploy job ships this build rather than making its own, so what goes live
      # is exactly what the steps above passed against.
      - name: Upload site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    name: Deploy
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
